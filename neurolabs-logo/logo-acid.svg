<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#10220f"/>
      <stop offset="0.55" stop-color="#081207"/>
      <stop offset="1" stop-color="#020502"/>
    </radialGradient>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="171" y1="82" x2="341" y2="278">
      <stop offset="0" stop-color="#e8ff5a"/>
      <stop offset="0.5" stop-color="#7cff6b"/>
      <stop offset="1" stop-color="#00d68f"/>
    </linearGradient>
    <linearGradient id="tg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0ff8a"/>
      <stop offset="0.5" stop-color="#b4ff8f"/>
      <stop offset="1" stop-color="#5cf2b0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="40"/></filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="translate(0,14)">
  <circle cx="256" cy="180" r="120" fill="#5dff7a" opacity="0.25" filter="url(#soft)"/>

  <!-- hexagon frame -->
  <polygon points="256,82 341,131 341,229 256,278 171,229 171,131"
           fill="none" stroke="url(#g)" stroke-width="5" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- faint neural links -->
  <g stroke="url(#g)" stroke-width="2" opacity="0.45">
    <line x1="216" y1="135" x2="256" y2="110"/><line x1="256" y1="110" x2="296" y2="135"/>
    <line x1="216" y1="225" x2="256" y2="250"/><line x1="256" y1="250" x2="296" y2="225"/>
    <line x1="256" y1="110" x2="256" y2="180"/><line x1="256" y1="180" x2="256" y2="250"/>
    <line x1="216" y1="135" x2="296" y2="225"/>
  </g>

  <!-- N built from synapses -->
  <g stroke="url(#g)" stroke-width="9" stroke-linecap="round" filter="url(#glow)">
    <line x1="216" y1="225" x2="216" y2="135"/>
    <line x1="216" y1="135" x2="296" y2="225"/>
    <line x1="296" y1="225" x2="296" y2="135"/>
  </g>

  <!-- nodes -->
  <g filter="url(#glow)">
    <circle cx="216" cy="135" r="11" fill="#e8ff5a"/>
    <circle cx="216" cy="225" r="11" fill="#b8ff60"/>
    <circle cx="256" cy="180" r="9"  fill="#7cff6b"/>
    <circle cx="296" cy="135" r="11" fill="#3df08a"/>
    <circle cx="296" cy="225" r="11" fill="#00d68f"/>
    <circle cx="256" cy="110" r="5.5" fill="#efffb0"/>
    <circle cx="256" cy="250" r="5.5" fill="#b0ffd0"/>
  </g>
  <g fill="#ffffff">
    <circle cx="216" cy="135" r="4"/><circle cx="216" cy="225" r="4"/>
    <circle cx="296" cy="135" r="4"/><circle cx="296" cy="225" r="4"/>
    <circle cx="256" cy="180" r="3.5"/>
  </g>

  <!-- wordmark -->
  <text x="256" y="356" text-anchor="middle" font-family="Inter Display, Inter" font-weight="700"
        font-size="62" letter-spacing="-1.5" fill="#f4ffe8">Neuro<tspan fill="url(#tg)">Labs</tspan></text>
  <text x="256" y="397" text-anchor="middle" font-family="Inter" font-weight="500"
        font-size="19" letter-spacing="4" fill="#8fa58a">BY QAYO TECH</text>
  </g>
</svg>
