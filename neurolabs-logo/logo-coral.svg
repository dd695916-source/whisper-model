<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#2a0f22"/>
      <stop offset="0.55" stop-color="#150712"/>
      <stop offset="1" stop-color="#060206"/>
    </radialGradient>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="171" y1="82" x2="341" y2="278">
      <stop offset="0" stop-color="#ffb4a2"/>
      <stop offset="0.5" stop-color="#ff5e78"/>
      <stop offset="1" stop-color="#7b2ff7"/>
    </linearGradient>
    <linearGradient id="tg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd3c4"/>
      <stop offset="0.5" stop-color="#ff9aa8"/>
      <stop offset="1" stop-color="#b98bff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="40"/></filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="translate(0,14)">
  <circle cx="256" cy="180" r="120" fill="#ff4f7a" opacity="0.25" filter="url(#soft)"/>

  <!-- hexagon frame -->
  <polygon points="256,82 341,131 341,229 256,278 171,229 171,131"
           fill="none" stroke="url(#g)" stroke-width="5" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- faint neural links -->
  <g stroke="url(#g)" stroke-width="2" opacity="0.45">
    <line x1="216" y1="135" x2="256" y2="110"/><line x1="256" y1="110" x2="296" y2="135"/>
    <line x1="216" y1="225" x2="256" y2="250"/><line x1="256" y1="250" x2="296" y2="225"/>
    <line x1="256" y1="110" x2="256" y2="180"/><line x1="256" y1="180" x2="256" y2="250"/>
    <line x1="216" y1="135" x2="296" y2="225"/>
  </g>

  <!-- N built from synapses -->
  <g stroke="url(#g)" stroke-width="9" stroke-linecap="round" filter="url(#glow)">
    <line x1="216" y1="225" x2="216" y2="135"/>
    <line x1="216" y1="135" x2="296" y2="225"/>
    <line x1="296" y1="225" x2="296" y2="135"/>
  </g>

  <!-- nodes -->
  <g filter="url(#glow)">
    <circle cx="216" cy="135" r="11" fill="#ffb4a2"/>
    <circle cx="216" cy="225" r="11" fill="#ff8a8a"/>
    <circle cx="256" cy="180" r="9"  fill="#ff5e78"/>
    <circle cx="296" cy="135" r="11" fill="#c04dd8"/>
    <circle cx="296" cy="225" r="11" fill="#7b2ff7"/>
    <circle cx="256" cy="110" r="5.5" fill="#ffd6cc"/>
    <circle cx="256" cy="250" r="5.5" fill="#e0c0ff"/>
  </g>
  <g fill="#ffffff">
    <circle cx="216" cy="135" r="4"/><circle cx="216" cy="225" r="4"/>
    <circle cx="296" cy="135" r="4"/><circle cx="296" cy="225" r="4"/>
    <circle cx="256" cy="180" r="3.5"/>
  </g>

  <!-- wordmark -->
  <text x="256" y="356" text-anchor="middle" font-family="Inter Display, Inter" font-weight="700"
        font-size="62" letter-spacing="-1.5" fill="#fff0f3">Neuro<tspan fill="url(#tg)">Labs</tspan></text>
  <text x="256" y="397" text-anchor="middle" font-family="Inter" font-weight="500"
        font-size="19" letter-spacing="4" fill="#a88fa0">BY QAYO TECH</text>
  </g>
</svg>
